
name: Compilar APK Android - Physical Cloud

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build-apk:
    name: Gerar APK Physical Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 34
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Compilar APK
        run: |
          java -version
          gradle --version
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verificar APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: physical-cloud-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
